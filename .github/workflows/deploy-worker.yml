name: Deploy Worker to Azure Function App

on:
  push:
    branches: [ "main" ]
    paths:
      - 'worker/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore worker/worker.csproj

    - name: Build with dotnet
      run: dotnet build worker/worker.csproj --configuration Release --no-restore

    - name: Publish function app
      run: dotnet publish worker/worker.csproj --configuration Release --output ./publish_worker

    - name: Deploy to Azure Function App
      uses: Azure/functions-action@v1
      with:
        app-name: 'productappworker'
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        package: ./publish_worker