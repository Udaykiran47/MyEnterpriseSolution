<div class="container mt-4">
  <h2>Async Product Processing Dashboard</h2>
  
  <form (ngSubmit)="submitOrder()" class="mb-4">
    <div class="mb-3">
      <label>Product Name</label>
      <input type="text" [(ngModel)]="newOrder.productName" name="productName" class="form-control" required />
    </div>
    <div class="mb-3">
      <label>Price</label>
      <input type="number" [(ngModel)]="newOrder.price" name="price" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary">Submit Order</button>
  </form>

  <hr />

  <h3>Live Tracking Status</h3>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Status</th>
        <th>Processing Details</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of orders">
        <td>{{ o.id }}</td>
        <td>{{ o.productName }}</td>
        <td>
          <span [ngClass]="{
            'badge bg-warning': o.status === 'Pending',
            'badge bg-info': o.status === 'Processing',
            'badge bg-success': o.status === 'Completed'
          }">{{ o.status }}</span>
        </td>
        <td>{{ o.processingDetails }}</td>
      </tr>
    </tbody>
  </table>
</div>
